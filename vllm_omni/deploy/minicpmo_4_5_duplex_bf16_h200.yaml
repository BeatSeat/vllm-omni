# Opt-in single-H200 native full-duplex memory-optimized profile (V1).
# Profile Option B: Compressed BF16 DiT attention cache for high session capacity.
# Uses ragged Whole-Euler Flow graphs with standard arena allocation, allowing
# DiT key/value cache compression to BF16 (halving DiT KV footprint).
base_config: minicpmo_4_5.yaml

connectors:
  connector_of_shared_memory:
    extra:
      token2wav_allow_tf32: true
      # Stage 2: Flow condition encoder CUDA graph
      cfm_encoder_cuda_graph: true
      # Stage 2: Compressed BF16 DiT attention cache (disables cfm_fused_body / cfm_slot_pool)
      code2wav_bfloat16_attention_cache: true
      cfm_fused_body: false
      cfm_slot_pool: false

stages:
  - stage_id: 0
    enforce_eager: false
    hf_overrides:
      # Stage 0: Incremental sliding window Fbank feature extraction
      duplex_incremental_fbank: true
      # Stage 0: Fused packed SigLIP encoder layers
      vision_fused_layers: true
      # Stage 0: Packed SigLIP tower & resampler CUDA graph
      vision_cuda_graph: true
      # Stage 0: Steady Whisper streaming audio encoder CUDA graph
      duplex_audio_encoder_cuda_graph: true
      duplex_audio_encoder_cuda_graph_batch_sizes_from_sessions: true
      # Stage 0: Pinned memory async H2D copy for streaming audio chunks
      duplex_audio_encoder_pinned_h2d: true
