# Opt-in CUDA Model Runner V2 profile for MiniCPM-o 4.5 full-duplex serving:
# the Thinker (stage 0), Talker (stage 1) and Code2Wav (stage 2) run on MRv2.
# Enables unified MRv2 execution for duplex sessions, retaining native
# Stage-0 streaming audio preprocessing, KV sliding window reanchor,
# device duplex sampling hooks, and streaming Code2Wav waveform synthesis.
base_config: minicpmo_4_5.yaml

session_mode: duplex
model_runner: v2

connectors:
  connector_of_shared_memory:
    extra:
      hift_graph_capture_batch_sizes: [1, 2, 4, 8]
      token2wav_allow_tf32: true

stages:
  - stage_id: 0
    model_runner: v2
    async_chunk: false
  - stage_id: 1
    model_runner: v2
  - stage_id: 2
    model_runner: v2
    async_scheduling: false

platforms:
  cuda:
    stages:
      - stage_id: 1
        kv_cache_memory_bytes: 2147483648
  npu:
    model_runner: v1
  xpu:
    model_runner: v1
  rocm:
    model_runner: v1
  musa:
    model_runner: v1
