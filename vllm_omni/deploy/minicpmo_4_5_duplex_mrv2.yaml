# Opt-in CUDA Model Runner V2 profile for MiniCPM-o 4.5 full-duplex serving:
# Thinker (stage 0) and Code2Wav (stage 2) run on MRv2; Talker stays on V1.
# Enables MRv2 execution for duplex sessions, retaining native
# Stage-0 streaming audio preprocessing, KV sliding window reanchor,
# device duplex sampling hooks, and streaming Code2Wav waveform synthesis.
base_config: minicpmo_4_5.yaml

session_mode: duplex
model_runner: v2

stages:
  - stage_id: 0
    async_chunk: false
    hf_overrides:
      duplex_audio_encoder_cuda_graph_batch_sizes_from_sessions: true
  # Required: streaming prompt-window replacement currently uses the V1 adapter.
  - stage_id: 1
    model_runner: v1
  - stage_id: 2
    async_scheduling: false

platforms:
  npu:
    model_runner: v1
  xpu:
    model_runner: v1
  rocm:
    model_runner: v1
  musa:
    model_runner: v1
